<!DOCTYPE html>
<html>

<head>

    <title>Log In</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="logo">
        🚗 NeighbourLink
    </div>

</header>

<main class="login-page">

    <div class="login-box">

        <h1>Log In</h1>

        <input type="email"
        placeholder="Email">

        <input type="password"
        placeholder="Password">

        <button onclick="showLoginMessage()"
        class="login-btn">

            Log In

        </button>

        <div id="login-message">

            ✅ Successfully logged in.

        </div>

    </div>

</main>

<script>

function showLoginMessage() {

document.getElementById("login-message")
.style.display = "block";

}

</script>

</body>
</html>
