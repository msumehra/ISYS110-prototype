<!DOCTYPE html>
<html>

<head>
    <title>Offer a Ride</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="offer-box">

   

    <div class="top-bar">
        <h2>Offer a Ride</h2>
    </div>

    

    <div class="offer-content">

        <label>From (Pickup Location)</label>

        <input type="text"
        placeholder="e.g. Suburb Station">

        <label>To (Destination)</label>

        <input type="text"
        placeholder="e.g. City Centre">

        <div class="row">

            <div>

                <label>Date</label>

                <input type="date">

            </div>

            <div>

                <label>Time</label>

                <input type="time">

            </div>

        </div>

        <label>Available Seats</label>

        <input type="number"
        placeholder="Enter seats available">

        

        <a href="requests.html"
        class="offer-btn">

            Offer Ride

        </a>

    </div>

</div>

</body>
</html>
